<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subnautica Style Reproduction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #00140a;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #overlay {
    position: absolute;
    bottom: 28px;
    left: 28px;
    color: #7fffd4;
    text-shadow: 0 0 10px #00ffaa66, 0 0 24px #00ffaa33;
    pointer-events: none;
    z-index: 2;
  }
  #overlay h1 {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  #overlay p {
    font-size: 0.85rem;
    opacity: 0.7;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="overlay">
  <h1>Planet 4546B // Kelp Forest</h1>
  <p>Procedural style reproduction of Subnautica's visual identity</p>
</div>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function rand(a, b) { return Math.random() * (b - a) + a; }

/* ---------- Helpers ---------- */
const seededRandom = (() => {
  let seed = 1337;
  return () => {
    seed = (seed * 16807 + 0) % 2147483647;
    return (seed - 1) / 2147483646;
  };
})();

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- Background Gradient (rich teals) ---------- */
function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a7a6a');
  bg.addColorStop(0.15, '#147a5e');
  bg.addColorStop(0.35, '#0f5a4a');
  bg.addColorStop(0.6, '#0a3d30');
  bg.addColorStop(0.85, '#052018');
  bg.addColorStop(1, '#010b06');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- God Rays (soft, volumetric, dusty) ---------- */
const rays = [];
for (let i = 0; i < 10; i++) {
  rays.push({
    x: rand(W * 0.02, W * 0.98),
    topWidth: rand(50, 180),
    bottomWidth: rand(200, 450),
    angle: rand(-0.15, 0.15),
    phase: rand(0, Math.PI * 2),
    baseOpacity: rand(0.05, 0.12),
    speed: rand(0.0002, 0.0005),
    color: Math.random() > 0.5 ? '200,255,240' : '160,240,220'
  });
}

function drawGodRays(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  rays.forEach((r, idx) => {
    const x = r.x + Math.sin(t * r.speed * 2 + r.phase) * 60;
    const flicker = 0.5 + 0.5 * Math.sin(t * r.speed * 5 + r.phase);
    const topW = r.topWidth * (0.85 + 0.15 * Math.sin(t * 0.0003 + idx));

    const grad = ctx.createLinearGradient(x, 0, x + Math.tan(r.angle) * H, H);
    grad.addColorStop(0, `rgba(${r.color}, ${r.baseOpacity * flicker})`);
    grad.addColorStop(0.25, `rgba(${r.color}, ${r.baseOpacity * 0.7 * flicker})`);
    grad.addColorStop(0.55, `rgba(${r.color}, ${r.baseOpacity * 0.35 * flicker})`);
    grad.addColorStop(0.85, `rgba(${r.color}, ${r.baseOpacity * 0.1 * flicker})`);
    grad.addColorStop(1, `rgba(${r.color}, 0)`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - topW / 2, 0);
    ctx.lineTo(x + topW / 2, 0);
    ctx.lineTo(x + r.bottomWidth / 2 + Math.tan(r.angle) * H, H);
    ctx.lineTo(x - r.bottomWidth / 2 + Math.tan(r.angle) * H, H);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();
}

/* ---------- Caustics on surface and seabed ---------- */
const caustics = [];
for (let i = 0; i < 20; i++) {
  caustics.push({
    x: rand(0, W),
    y: rand(0, H * 0.35),
    r: rand(60, 140),
    dx: rand(0.2, 0.6),
    dy: rand(0.05, 0.15),
    phase: rand(0, Math.PI * 2)
  });
}

const seabedCaustics = [];
for (let i = 0; i < 14; i++) {
  seabedCaustics.push({
    x: rand(0, W),
    y: rand(H * 0.75, H * 0.98),
    r: rand(30, 70),
    dx: rand(0.15, 0.4),
    phase: rand(0, Math.PI * 2)
  });
}

function drawCaustics(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  caustics.forEach((c, i) => {
    const cx = ((c.x + t * c.dx + i * 100) % (W + 300)) - 150;
    const cy = ((c.y + t * c.dy) % (H * 0.4));
    const flicker = 0.5 + 0.5 * Math.sin(t * 0.001 + c.phase);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, c.r);
    grad.addColorStop(0, `rgba(220, 255, 240, ${0.07 * flicker})`);
    grad.addColorStop(0.4, `rgba(160, 240, 210, ${0.03 * flicker})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, c.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawSeabedCaustics(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  seabedCaustics.forEach((c, i) => {
    const cx = ((c.x + t * c.dx) % (W + 200)) - 100;
    const flicker = 0.5 + 0.5 * Math.sin(t * 0.0015 + c.phase);
    const grad = ctx.createRadialGradient(cx, c.y, 0, cx, c.y, c.r);
    grad.addColorStop(0, `rgba(200, 255, 230, ${0.14 * flicker})`);
    grad.addColorStop(0.5, `rgba(120, 230, 190, ${0.06 * flicker})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

/* ---------- Seabed ---------- */
function drawSeabed(t) {
  // Base sand
  const sandGrad = ctx.createLinearGradient(0, H * 0.72, 0, H);
  sandGrad.addColorStop(0, '#1e3020');
  sandGrad.addColorStop(0.3, '#a89868');
  sandGrad.addColorStop(0.7, '#d4c49a');
  sandGrad.addColorStop(1, '#8a7a52');
  ctx.fillStyle = sandGrad;
  ctx.fillRect(0, H * 0.72, W, H * 0.28);

  // Sand ripples
  ctx.strokeStyle = 'rgba(180, 165, 130, 0.15)';
  ctx.lineWidth = 1.5;
  for (let y = H * 0.74; y < H; y += 6) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const ry = y + Math.sin(x * 0.02 + y * 0.1) * 3;
      if (x === 0) ctx.moveTo(x, ry);
      else ctx.lineTo(x, ry);
    }
    ctx.stroke();
  }

  // Sand speckles
  ctx.fillStyle = 'rgba(220, 200, 160, 0.12)';
  for (let i = 0; i < 3000; i++) {
    const sx = rand(0, W);
    const sy = rand(H * 0.72, H);
    ctx.fillRect(sx, sy, rand(1, 3), rand(1, 2));
  }
  ctx.fillStyle = 'rgba(100, 90, 65, 0.1)';
  for (let i = 0; i < 1500; i++) {
    const sx = rand(0, W);
    const sy = rand(H * 0.72, H);
    ctx.fillRect(sx, sy, rand(1, 2), rand(1, 2));
  }

  // Larger rocks with detail
  for (let i = 0; i < 12; i++) {
    const rx = rand(-50, W + 50);
    const ry = H * 0.78 + rand(-15, 30);
    const rw = rand(40, 120);
    const rh = rand(25, 70);
    ctx.fillStyle = '#3d3020';
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + rw * 0.25, ry - rh * 0.85);
    ctx.lineTo(rx + rw * 0.6, ry - rh);
    ctx.lineTo(rx + rw * 0.85, ry - rh * 0.75);
    ctx.lineTo(rx + rw, ry);
    ctx.closePath();
    ctx.fill();
    // Rock shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + rw * 0.25, ry - rh * 0.85);
    ctx.lineTo(rx + rw * 0.5, ry - rh * 0.5);
    ctx.lineTo(rx + rw, ry);
    ctx.closePath();
    ctx.fill();
    // Rock highlight
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.moveTo(rx + rw * 0.3, ry - rh * 0.2);
    ctx.lineTo(rx + rw * 0.4, ry - rh * 0.8);
    ctx.lineTo(rx + rw * 0.55, ry - rh * 0.2);
    ctx.closePath();
    ctx.fill();
  }
}

/* ---------- Seabed Flora ---------- */
const seabedPlants = [];
for (let i = 0; i < 50; i++) {
  seabedPlants.push({
    x: rand(0, W),
    y: rand(H * 0.78, H * 0.97),
    height: rand(12, 40),
    color: Math.random() > 0.5 ? '#2d8a5e' : '#3a7a4d',
    type: Math.random() > 0.5 ? 'fern' : 'grass',
    swayPhase: rand(0, Math.PI * 2)
  });
}

function drawSeabedPlants(t) {
  seabedPlants.forEach(p => {
    const sway = Math.sin(t * 0.0008 + p.swayPhase) * 10;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    if (p.type === 'fern') {
      for (let s = 1; s <= 5; s++) {
        const py = p.y - (p.height / 5) * s;
        const px = p.x + sway * (s / 5);
        ctx.lineTo(px, py);
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate((sway > 0 ? 0.7 : -0.7) + Math.sin(t * 0.0015 + s) * 0.25);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(10, 0, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    } else {
      ctx.quadraticCurveTo(p.x + sway, p.y - p.height * 0.5, p.x + sway * 1.8, p.y - p.height);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

/* ---------- Creepvines (with iconic seed clusters) ---------- */
const creepvines = [];
for (let i = 0; i < 32; i++) {
  creepvines.push({
    x: rand(0, W),
    baseY: H + rand(10, 60),
    height: rand(H * 0.45, H * 1.15),
    stalkWidth: rand(3, 9),
    segments: Math.floor(rand(12, 26)),
    swaySpeed: rand(0.0006, 0.0018),
    swayPhase: rand(0, Math.PI * 2),
    seedCluster: true, // Most have seeds
    seedCount: Math.floor(rand(2, 5)),
    seedSide: Math.random() > 0.5 ? 1 : -1
  });
}

function drawCreepvines(t) {
  creepvines.forEach((vine, vidx) => {
    const mainSway = Math.sin(t * vine.swaySpeed + vine.swayPhase) * 55;
    const secSway = Math.sin(t * vine.swaySpeed * 1.4 + vine.swayPhase + 1.5) * 22;

    // Draw stalk with bezier for organic feel
    ctx.strokeStyle = '#166a45';
    ctx.lineWidth = vine.stalkWidth;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(vine.x, vine.baseY);

    const points = [];
    for (let s = 1; s <= vine.segments; s++) {
      const progress = s / vine.segments;
      const px = vine.x + mainSway * progress + secSway * progress * progress;
      const py = vine.baseY - vine.height * progress;
      points.push({x: px, y: py, p: progress});
      ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Broad flat leaves
    points.forEach((pt, pi) => {
      if (pi < 3 || pi > vine.segments - 3) return;
      if ((vidx * 7 + pi * 13) % 3 !== 0) return;

      const leafSize = 20 * (1 - pt.p) + 7;
      const leafAngle = Math.sin(t * 0.0008 + vidx + pi) * 0.35 + (mainSway > 0 ? 0.45 : -0.45);
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(leafAngle);
      ctx.fillStyle = `rgba(50, 160, 100, ${0.5 * (1 - pt.p) + 0.25})`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(leafSize * 0.4, -leafSize * 0.12, leafSize * 1.1, -leafSize * 0.08, leafSize * 1.4, 0);
      ctx.bezierCurveTo(leafSize * 1.1, leafSize * 0.08, leafSize * 0.4, leafSize * 0.12, 0, 0);
      ctx.fill();
      ctx.restore();
    });

    // CREEPVINE SEED CLUSTERS (iconic orange pods)
    if (vine.seedCluster) {
      const topIdx = Math.floor(vine.segments * rand(0.65, 0.95));
      if (topIdx < points.length) {
        const sp = points[topIdx];
        const side = vine.seedSide;
        const pulse = 0.5 + 0.5 * Math.sin(t * 0.0025 + vidx);

        // Outer glow/bloom
        const glow = ctx.createRadialGradient(sp.x + side * 16, sp.y, 0, sp.x + side * 16, sp.y, 35);
        glow.addColorStop(0, `rgba(255, 210, 80, ${pulse * 0.8})`);
        glow.addColorStop(0.3, `rgba(255, 150, 30, ${pulse * 0.45})`);
        glow.addColorStop(0.7, `rgba(255, 100, 10, ${pulse * 0.15})`);
        glow.addColorStop(1, 'rgba(255, 80, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sp.x + side * 16, sp.y, 35, 0, Math.PI * 2);
        ctx.fill();

        // Cluster of 3-4 pods
        const podOffsets = [
          {dx: 8, dy: 0, r: 7},
          {dx: 18, dy: -5, r: 6},
          {dx: 16, dy: 6, r: 5.5},
          {dx: 24, dy: 0, r: 4.5}
        ];
        podOffsets.forEach(po => {
          ctx.fillStyle = `rgba(255, 220, 100, ${pulse * 0.9})`;
          ctx.beginPath();
          ctx.arc(sp.x + side * po.dx, sp.y + po.dy, po.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(255, 180, 40, ${pulse * 0.7})`;
          ctx.beginPath();
          ctx.arc(sp.x + side * po.dx - 1, sp.y + po.dy - 1, po.r * 0.6, 0, Math.PI * 2);
          ctx.fill();
        });

        // Bright core sparkle
        ctx.fillStyle = `rgba(255, 255, 230, ${pulse})`;
        ctx.beginPath();
        ctx.arc(sp.x + side * 10, sp.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  });
}

/* ---------- Small Fish (Peepers / generic schools) ---------- */
const fishSchools = [];
for (let i = 0; i < 5; i++) {
  const count = Math.floor(rand(6, 16));
  const fish = [];
  for (let j = 0; j < count; j++) {
    fish.push({
      ox: rand(-40, 40),
      oy: rand(-20, 20),
      size: rand(2, 4),
    });
  }
  fishSchools.push({
    x: rand(0, W),
    y: rand(H * 0.15, H * 0.65),
    vx: rand(0.4, 1.0) * (Math.random() > 0.5 ? 1 : -1),
    fish: fish
  });
}

function drawFish(t) {
  fishSchools.forEach(school => {
    school.x += school.vx;
    if (school.x > W + 120) school.x = -120;
    if (school.x < -120) school.x = W + 120;

    const schoolSway = Math.sin(t * 0.0008 + school.y) * 15;

    school.fish.forEach(f => {
      const fx = school.x + f.ox + Math.sin(t * 0.002 + f.oy) * 12;
      const fy = school.y + f.oy + schoolSway + Math.cos(t * 0.0015 + f.ox) * 6;

      // Body
      ctx.fillStyle = 'rgba(140, 220, 255, 0.55)';
      ctx.beginPath();
      ctx.ellipse(fx, fy, f.size * 2.2, f.size, 0, 0, Math.PI * 2);
      ctx.fill();
      // Tail
      ctx.fillStyle = 'rgba(120, 200, 240, 0.45)';
      ctx.beginPath();
      ctx.moveTo(fx - f.size * 1.6, fy);
      ctx.lineTo(fx - f.size * 3.2, fy - f.size * 0.9);
      ctx.lineTo(fx - f.size * 3.2, fy + f.size * 0.9);
      ctx.closePath();
      ctx.fill();
      // Eye
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(fx + f.size * 0.8, fy - f.size * 0.3, f.size * 0.35, 0, Math.PI * 2);
      ctx.fill();
    });
  });
}

/* ---------- Bubbles ---------- */
const bubbles = [];
for (let i = 0; i < 70; i++) {
  bubbles.push({
    x: rand(0, W),
    y: rand(H * 0.3, H),
    r: rand(1.5, 5),
    vy: rand(-1.2, -3.5),
    wobble: rand(0.0008, 0.002),
    phase: rand(0, Math.PI * 2)
  });
}

function drawBubbles(t) {
  bubbles.forEach(b => {
    b.y += b.vy;
    b.x += Math.sin(t * b.wobble + b.phase) * 1.0;
    if (b.y < -20) { b.y = H + 20; b.x = rand(0, W); }

    ctx.strokeStyle = 'rgba(200, 255, 240, 0.4)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();
    // Highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------- Marine Snow Particles ---------- */
const particles = [];
for (let i = 0; i < 500; i++) {
  particles.push({
    x: rand(0, W),
    y: rand(0, H),
    r: rand(0.3, 2.0),
    vy: rand(-0.3, -1.2),
    vx: rand(-0.25, 0.25),
    alpha: rand(0.15, 0.6),
    phase: rand(0, Math.PI * 2),
    color: Math.random() > 0.75 ? '255, 230, 160' : '180, 255, 220'
  });
}

function drawParticles(t) {
  particles.forEach(p => {
    p.y += p.vy;
    p.x += p.vx + Math.sin(t * 0.0006 + p.phase) * 0.35;
    if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    const flicker = 0.5 + 0.5 * Math.sin(t * 0.0018 + p.phase);
    ctx.fillStyle = `rgba(${p.color}, ${p.alpha * flicker})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------- Ground Bioluminescent Flora ---------- */
const glowPods = [];
for (let i = 0; i < 22; i++) {
  glowPods.push({
    x: rand(0, W),
    y: rand(H * 0.75, H * 0.96),
    r: rand(2, 5),
    color: Math.random() > 0.35 ? '#ffaa22' : '#44ddaa',
    pulseSpeed: rand(0.0015, 0.004),
    phase: rand(0, Math.PI * 2)
  });
}

function drawGlowPods(t) {
  glowPods.forEach(g => {
    const pulse = 0.35 + 0.65 * Math.sin(t * g.pulseSpeed + g.phase);
    const glow = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r * 5);
    const col = g.color === '#ffaa22' ? '255,180,40' : '60,220,170';
    glow.addColorStop(0, `rgba(${col}, ${pulse * 0.9})`);
    glow.addColorStop(0.4, `rgba(${col}, ${pulse * 0.3})`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r * 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = g.color === '#ffaa22' ? `rgba(255,220,90,${pulse})` : `rgba(100,255,200,${pulse})`;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------- Volumetric Depth Fog ---------- */
function drawFog() {
  const vgrad = ctx.createLinearGradient(0, 0, 0, H);
  vgrad.addColorStop(0, 'rgba(2, 20, 12, 0.02)');
  vgrad.addColorStop(0.35, 'rgba(2, 20, 12, 0.12)');
  vgrad.addColorStop(0.7, 'rgba(2, 20, 12, 0.45)');
  vgrad.addColorStop(1, 'rgba(2, 20, 12, 0.78)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, W, H);

  const cgrad = ctx.createRadialGradient(W / 2, H * 0.4, H * 0.2, W / 2, H * 0.4, H * 0.9);
  cgrad.addColorStop(0, 'rgba(2, 20, 12, 0)');
  cgrad.addColorStop(1, 'rgba(2, 20, 12, 0.45)');
  ctx.fillStyle = cgrad;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- Main Loop ---------- */
function draw(t) {
  drawBackground();
  drawGodRays(t);
  drawCaustics(t);
  drawSeabed(t);
  drawSeabedCaustics(t);
  drawGlowPods(t);
  drawSeabedPlants(t);
  drawCreepvines(t);
  drawFish(t);
  drawBubbles(t);
  drawParticles(t);
  drawFog();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
