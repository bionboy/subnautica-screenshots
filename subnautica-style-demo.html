<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subnautica Style Reproduction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020d06;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #overlay {
    position: absolute;
    bottom: 24px;
    left: 24px;
    color: #a8f0e0;
    text-shadow: 0 0 8px #00ffaa44;
    pointer-events: none;
  }
  #overlay h1 {
    font-size: 1.4rem;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
    opacity: 0.9;
  }
  #overlay p {
    font-size: 0.8rem;
    opacity: 0.6;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="overlay">
  <h1>Planet 4546B // Kelp Forest</h1>
  <p>Procedural style reproduction of Subnautica's visual identity</p>
</div>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ---------- Palettes ---------- */
const PAL = {
  deep:   '#020d06',
  shadow: '#0a2418',
  mid:    '#147a5e',
  haze:   '#1b4d3a',
  light:  '#2a8a6a',
  surface:'#4ad9a8',
  bio:    ['#ff9900', '#ffcc33', '#ffb84d', '#ff7700'],
  rock:   '#3d2f1a',
  sand:   '#c9b896'
};

/* ---------- Helpers ---------- */
function rand(a, b) { return Math.random() * (b - a) + a; }
function lerp(a, b, t) { return a + (b - a) * t; }
function noise(x) {
  return Math.sin(x) * 0.5 + Math.sin(x * 2.3) * 0.25 + Math.sin(x * 5.7) * 0.125;
}

/* ---------- God Rays ---------- */
const rays = [];
for (let i = 0; i < 7; i++) {
  rays.push({
    x: rand(0, W),
    width: rand(40, 120),
    angle: rand(-0.15, 0.15),
    speed: rand(0.2, 0.6),
    phase: rand(0, Math.PI * 2),
    opacity: rand(0.03, 0.08)
  });
}

/* ---------- Particles (Marine Snow) ---------- */
const particles = [];
for (let i = 0; i < 300; i++) {
  particles.push({
    x: rand(0, W),
    y: rand(0, H),
    r: rand(0.5, 2.5),
    vy: rand(-0.3, -1.2),
    vx: rand(-0.2, 0.2),
    alpha: rand(0.1, 0.5),
    pulse: rand(0, Math.PI * 2)
  });
}

/* ---------- Kelp / Creepvine Forest ---------- */
const kelps = [];
const KELP_COUNT = 40;
for (let i = 0; i < KELP_COUNT; i++) {
  const depthFactor = i / KELP_COUNT;
  kelps.push({
    x: rand(0, W),
    baseY: H + rand(20, 100),
    height: rand(H * 0.4, H * 1.2),
    width: rand(3, 8),
    segments: Math.floor(rand(8, 16)),
    swaySpeed: rand(0.001, 0.003),
    swayPhase: rand(0, Math.PI * 2),
    color: depthFactor < 0.3 ? PAL.light : (depthFactor < 0.7 ? PAL.mid : PAL.shadow),
    seedCluster: Math.random() > 0.7,
    seedY: rand(0.3, 0.7)
  });
}

/* ---------- Ground / Seabed ---------- */
function drawSeabed(t) {
  const grad = ctx.createLinearGradient(0, H * 0.7, 0, H);
  grad.addColorStop(0, '#0d1f14');
  grad.addColorStop(0.5, '#1a2e1a');
  grad.addColorStop(1, '#051208');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H * 0.75, W, H * 0.25);

  // Sandy texture
  for (let i = 0; i < 800; i++) {
    const sx = rand(0, W);
    const sy = rand(H * 0.75, H);
    const distFromTop = (sy - H * 0.75) / (H * 0.25);
    ctx.fillStyle = `rgba(200, 180, 140, ${0.03 + distFromTop * 0.06})`;
    ctx.fillRect(sx, sy, rand(1, 3), rand(1, 2));
  }

  // Rock formations
  for (let i = 0; i < 6; i++) {
    const rx = (W / 6) * i + rand(-60, 60);
    const ry = H * 0.78 + rand(0, 40);
    const size = rand(40, 100);
    ctx.fillStyle = PAL.rock;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + size * 0.4, ry - size * 0.8);
    ctx.lineTo(rx + size, ry);
    ctx.closePath();
    ctx.fill();
    // Rock highlight
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.beginPath();
    ctx.moveTo(rx + size * 0.15, ry - size * 0.1);
    ctx.lineTo(rx + size * 0.35, ry - size * 0.7);
    ctx.lineTo(rx + size * 0.55, ry - size * 0.1);
    ctx.closePath();
    ctx.fill();
  }
}

/* ---------- Bioluminescent Flora on Ground ---------- */
const groundFlora = [];
for (let i = 0; i < 25; i++) {
  groundFlora.push({
    x: rand(0, W),
    y: rand(H * 0.76, H * 0.95),
    color: PAL.bio[Math.floor(rand(0, PAL.bio.length))],
    size: rand(2, 5),
    pulseSpeed: rand(0.002, 0.005),
    phase: rand(0, Math.PI * 2)
  });
}

/* ---------- Caustics (Surface Light Patterns) ---------- */
function drawCaustics(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < 12; i++) {
    const cx = ((t * 0.05 + i * 137) % (W + 200)) - 100;
    const cy = ((t * 0.03 + i * 89) % (H * 0.5)) + 20;
    const r = 60 + i * 8;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, `rgba(120, 255, 200, ${0.04 + Math.sin(t * 0.001 + i) * 0.02})`);
    grad.addColorStop(1, 'rgba(120, 255, 200, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ---------- Draw Kelp ---------- */
function drawKelp(t) {
  kelps.forEach((k, idx) => {
    const sway = Math.sin(t * k.swaySpeed + k.swayPhase) * 40;
    const sway2 = Math.sin(t * k.swaySpeed * 1.7 + k.swayPhase + 1) * 20;

    ctx.strokeStyle = k.color;
    ctx.lineWidth = k.width;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(k.x, k.baseY);

    for (let s = 1; s <= k.segments; s++) {
      const progress = s / k.segments;
      const px = k.x + sway * progress + sway2 * progress * progress;
      const py = k.baseY - k.height * progress;
      ctx.lineTo(px, py);

      // Draw leaf at this segment
      if (s > 2 && s < k.segments - 1) {
        const leafSize = 12 * (1 - progress) + 4;
        const leafAngle = Math.sin(t * 0.002 + idx + s) * 0.4;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(leafAngle + (sway > 0 ? 0.5 : -0.5));
        ctx.fillStyle = `rgba(40, 140, 100, ${0.4 * (1 - progress) + 0.2})`;
        ctx.beginPath();
        ctx.ellipse(leafSize * 0.5, 0, leafSize, leafSize * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Bioluminescent seed clusters
    if (k.seedCluster) {
      const sy = k.baseY - k.height * k.seedY;
      const sx = k.x + sway * k.seedY + sway2 * k.seedY * k.seedY;
      const pulse = 0.6 + 0.4 * Math.sin(t * 0.003 + idx);
      const seedGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 18);
      seedGrad.addColorStop(0, `rgba(255, 200, 50, ${pulse})`);
      seedGrad.addColorStop(0.4, `rgba(255, 150, 0, ${pulse * 0.5})`);
      seedGrad.addColorStop(1, 'rgba(255, 150, 0, 0)');
      ctx.fillStyle = seedGrad;
      ctx.beginPath();
      ctx.arc(sx, sy, 18, 0, Math.PI * 2);
      ctx.fill();

      // Inner core
      ctx.fillStyle = `rgba(255, 240, 180, ${pulse * 0.9})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

/* ---------- God Rays ---------- */
function drawGodRays(t) {
  rays.forEach(r => {
    const x = r.x + Math.sin(t * 0.0003 + r.phase) * 60;
    const flicker = 0.7 + 0.3 * Math.sin(t * 0.001 + r.phase);
    const grad = ctx.createLinearGradient(x, 0, x + Math.tan(r.angle) * H, H);
    grad.addColorStop(0, `rgba(180, 255, 220, ${r.opacity * flicker})`);
    grad.addColorStop(0.6, `rgba(100, 220, 180, ${r.opacity * 0.5 * flicker})`);
    grad.addColorStop(1, 'rgba(50, 150, 120, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - r.width / 2, 0);
    ctx.lineTo(x + r.width / 2, 0);
    ctx.lineTo(x + r.width / 2 + Math.tan(r.angle) * H, H);
    ctx.lineTo(x - r.width / 2 + Math.tan(r.angle) * H, H);
    ctx.closePath();
    ctx.fill();
  });
}

/* ---------- Volumetric Depth Fog ---------- */
function drawFog() {
  // Horizontal fog gradient (darker at bottom)
  const vgrad = ctx.createLinearGradient(0, 0, 0, H);
  vgrad.addColorStop(0, 'rgba(2, 13, 6, 0.1)');
  vgrad.addColorStop(0.5, 'rgba(2, 13, 6, 0.3)');
  vgrad.addColorStop(1, 'rgba(2, 13, 6, 0.75)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, W, H);

  // Distance fog (darker at edges, subtle vignette)
  const cgrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
  cgrad.addColorStop(0, 'rgba(2, 13, 6, 0)');
  cgrad.addColorStop(1, 'rgba(2, 13, 6, 0.5)');
  ctx.fillStyle = cgrad;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- Particles ---------- */
function drawParticles(t) {
  particles.forEach(p => {
    p.y += p.vy;
    p.x += p.vx + Math.sin(t * 0.001 + p.pulse) * 0.3;
    if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    const flicker = 0.5 + 0.5 * Math.sin(t * 0.002 + p.pulse);
    ctx.fillStyle = `rgba(160, 255, 210, ${p.alpha * flicker})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------- Ground Flora Bioluminescence ---------- */
function drawGroundFlora(t) {
  groundFlora.forEach(g => {
    const pulse = 0.5 + 0.5 * Math.sin(t * g.pulseSpeed + g.phase);
    const glow = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.size * 4);
    glow.addColorStop(0, hexToRgba(g.color, pulse * 0.8));
    glow.addColorStop(0.5, hexToRgba(g.color, pulse * 0.2));
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.size * 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = hexToRgba('#ccffaa', pulse * 0.4);
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* ---------- Surface Light Overlay ---------- */
function drawSurfaceLight(t) {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  grad.addColorStop(0, 'rgba(180, 255, 230, 0.15)');
  grad.addColorStop(0.3, 'rgba(80, 200, 160, 0.05)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.5);
}

/* ---------- Main Loop ---------- */
function draw(t) {
  // Base background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a3d2b');
  bg.addColorStop(0.4, '#0d5c42');
  bg.addColorStop(1, '#020d06');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawGodRays(t);
  drawCaustics(t);
  drawSeabed(t);
  drawGroundFlora(t);
  drawKelp(t);
  drawParticles(t);
  drawFog();
  drawSurfaceLight(t);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
