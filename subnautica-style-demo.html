<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subnautica Style Reproduction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #00140a;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #overlay {
    position: absolute;
    bottom: 28px;
    left: 28px;
    color: #7fffd4;
    text-shadow: 0 0 10px #00ffaa66, 0 0 24px #00ffaa33;
    pointer-events: none;
    z-index: 2;
  }
  #overlay h1 {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  #overlay p {
    font-size: 0.85rem;
    opacity: 0.7;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="overlay">
  <h1>Planet 4546B // Kelp Forest</h1>
  <p>Procedural style reproduction of Subnautica's visual identity</p>
</div>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function rand(a, b) { return Math.random() * (b - a) + a; }
function lerp(a, b, t) { return a + (b - a) * t; }

/* ---------- Config ---------- */
const SEED = 42;
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

/* ---------- God Rays (bright volumetric cones) ---------- */
const rays = [];
for (let i = 0; i < 9; i++) {
  rays.push({
    x: rand(W * 0.05, W * 0.95),
    topWidth: rand(60, 160),
    bottomWidth: rand(180, 350),
    angle: rand(-0.12, 0.12),
    speed: rand(0.3, 0.7),
    phase: rand(0, Math.PI * 2),
    baseOpacity: rand(0.06, 0.14),
    color: i % 3 === 0 ? '200,255,230' : (i % 3 === 1 ? '160,240,210' : '180,250,220')
  });
}

/* ---------- Marine Snow / Particles ---------- */
const particles = [];
for (let i = 0; i < 400; i++) {
  particles.push({
    x: rand(0, W),
    y: rand(0, H),
    r: rand(0.3, 2.2),
    vy: rand(-0.4, -1.4),
    vx: rand(-0.3, 0.3),
    alpha: rand(0.15, 0.55),
    phase: rand(0, Math.PI * 2),
    color: Math.random() > 0.7 ? '255,220,160' : '180,255,220'
  });
}

/* ---------- Air Bubbles ---------- */
const bubbles = [];
for (let i = 0; i < 60; i++) {
  bubbles.push({
    x: rand(0, W),
    y: rand(H * 0.3, H),
    r: rand(1, 4),
    vy: rand(-1.5, -3),
    wobble: rand(0.001, 0.003),
    phase: rand(0, Math.PI * 2)
  });
}

/* ---------- Creepvine (Kelp) Forest ---------- */
const creepvines = [];
const VINE_COUNT = 28;
for (let i = 0; i < VINE_COUNT; i++) {
  const depth = i / VINE_COUNT;
  creepvines.push({
    x: rand(0, W),
    baseY: H + rand(10, 80),
    height: rand(H * 0.5, H * 1.1),
    stalkWidth: rand(4, 10),
    segments: Math.floor(rand(10, 22)),
    swaySpeed: rand(0.0008, 0.002),
    swayPhase: rand(0, Math.PI * 2),
    // Color: brighter near surface (top), darker near bottom
    stalkColor: depth < 0.3 ? '#1a6b4a' : (depth < 0.6 ? '#145c3d' : '#0d3d2b'),
    leafColor: depth < 0.3 ? '#2a9e6e' : (depth < 0.6 ? '#1f7a55' : '#155c3d'),
    seedCluster: Math.random() > 0.65,
    seedHeight: rand(0.25, 0.65), // normalized height position
    seedSide: Math.random() > 0.5 ? 1 : -1,
    hasLeaves: true,
    leafDensity: rand(0.6, 1.0)
  });
}

/* ---------- Seabed Details ---------- */
const seabedPlants = [];
for (let i = 0; i < 40; i++) {
  seabedPlants.push({
    x: rand(0, W),
    y: rand(H * 0.82, H * 0.97),
    height: rand(15, 45),
    color: rand(0,1)>0.5 ? '#2a8a5a' : '#3d6b4d',
    type: Math.random() > 0.6 ? 'fern' : 'grass',
    swayPhase: rand(0, Math.PI*2)
  });
}

const rocks = [];
for (let i = 0; i < 10; i++) {
  rocks.push({
    x: rand(0, W),
    y: H * 0.82 + rand(-10, 20),
    w: rand(50, 150),
    h: rand(30, 80),
    color: '#3a3020'
  });
}

/* ---------- Small Fish Schools ---------- */
const fishSchools = [];
for (let i = 0; i < 4; i++) {
  const count = Math.floor(rand(8, 18));
  const sx = rand(0, W);
  const sy = rand(H * 0.2, H * 0.7);
  const school = [];
  for (let j = 0; j < count; j++) {
    school.push({
      ox: rand(-30, 30),
      oy: rand(-15, 15),
      size: rand(2, 4),
      speed: rand(0.5, 1.2)
    });
  }
  fishSchools.push({ x: sx, y: sy, vx: rand(0.3, 0.8) * (Math.random() > 0.5 ? 1 : -1), fish: school });
}

/* ---------- Ground Bioluminescent Accents ---------- */
const glowPods = [];
for (let i = 0; i < 18; i++) {
  glowPods.push({
    x: rand(0, W),
    y: rand(H * 0.78, H * 0.96),
    r: rand(2, 4),
    color: Math.random() > 0.4 ? '#ffaa22' : '#88ffcc',
    pulseSpeed: rand(0.002, 0.006),
    phase: rand(0, Math.PI * 2)
  });
}

/* ---------- Helper: Hex to RGBA ---------- */
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- Draw Functions ---------- */

function drawBackground() {
  // Rich gradient: bright teal at top (surface), deep green-blue at bottom
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0f5a4a');
  bg.addColorStop(0.25, '#147a5e');
  bg.addColorStop(0.5, '#0d5c42');
  bg.addColorStop(0.75, '#082e1f');
  bg.addColorStop(1, '#020d06');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

function drawSurfaceLight(t) {
  // Bright surface glow
  const surf = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  surf.addColorStop(0, 'rgba(140, 255, 220, 0.35)');
  surf.addColorStop(0.15, 'rgba(100, 230, 190, 0.18)');
  surf.addColorStop(0.35, 'rgba(60, 180, 140, 0.05)');
  surf.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = surf;
  ctx.fillRect(0, 0, W, H * 0.45);

  // Caustic light spots on upper area
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < 15; i++) {
    const cx = ((t * 0.04 + i * 157) % (W + 300)) - 150;
    const cy = ((t * 0.02 + i * 97) % (H * 0.4)) + 10;
    const r = 80 + i * 10;
    const flicker = 0.5 + 0.5 * Math.sin(t * 0.001 + i);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, `rgba(200, 255, 240, ${0.08 * flicker})`);
    grad.addColorStop(0.5, `rgba(120, 240, 200, ${0.04 * flicker})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGodRays(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  rays.forEach((r, idx) => {
    const x = r.x + Math.sin(t * 0.00025 + r.phase) * 80;
    const flicker = 0.6 + 0.4 * Math.sin(t * 0.0008 + r.phase);
    const topW = r.topWidth * (0.8 + 0.2 * Math.sin(t * 0.0003 + idx));
    const botW = r.bottomWidth;

    const grad = ctx.createLinearGradient(x, 0, x + Math.tan(r.angle) * H, H);
    grad.addColorStop(0, `rgba(${r.color}, ${r.baseOpacity * flicker})`);
    grad.addColorStop(0.35, `rgba(${r.color}, ${r.baseOpacity * 0.6 * flicker})`);
    grad.addColorStop(0.7, `rgba(${r.color}, ${r.baseOpacity * 0.25 * flicker})`);
    grad.addColorStop(1, `rgba(${r.color}, 0)`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - topW / 2, 0);
    ctx.lineTo(x + topW / 2, 0);
    ctx.lineTo(x + botW / 2 + Math.tan(r.angle) * H, H);
    ctx.lineTo(x - botW / 2 + Math.tan(r.angle) * H, H);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();
}

function drawSeabed(t) {
  // Sand gradient
  const sand = ctx.createLinearGradient(0, H * 0.75, 0, H);
  sand.addColorStop(0, '#1a2e1e');
  sand.addColorStop(0.4, '#c9b896');
  sand.addColorStop(1, '#8a7a5a');
  ctx.fillStyle = sand;
  ctx.fillRect(0, H * 0.75, W, H * 0.25);

  // Sand texture speckles
  ctx.fillStyle = 'rgba(200, 180, 150, 0.15)';
  for (let i = 0; i < 2000; i++) {
    const sx = rand(0, W);
    const sy = rand(H * 0.75, H);
    ctx.fillRect(sx, sy, rand(1, 3), rand(1, 2));
  }
  ctx.fillStyle = 'rgba(100, 90, 70, 0.1)';
  for (let i = 0; i < 1000; i++) {
    const sx = rand(0, W);
    const sy = rand(H * 0.75, H);
    ctx.fillRect(sx, sy, rand(1, 2), rand(1, 2));
  }

  // Caustics on seabed
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < 8; i++) {
    const cx = ((t * 0.03 + i * 213) % (W + 200)) - 100;
    const cy = H * 0.82 + ((t * 0.015 + i * 67) % (H * 0.18));
    const r = 40 + i * 6;
    const flicker = 0.5 + 0.5 * Math.sin(t * 0.001 + i);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, `rgba(180, 255, 220, ${0.12 * flicker})`);
    grad.addColorStop(0.6, `rgba(100, 220, 180, ${0.05 * flicker})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Rocks
  rocks.forEach(rock => {
    ctx.fillStyle = rock.color;
    ctx.beginPath();
    ctx.moveTo(rock.x, rock.y);
    ctx.lineTo(rock.x + rock.w * 0.3, rock.y - rock.h * 0.9);
    ctx.lineTo(rock.x + rock.w * 0.7, rock.y - rock.h * 0.95);
    ctx.lineTo(rock.x + rock.w, rock.y);
    ctx.closePath();
    ctx.fill();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.moveTo(rock.x + rock.w * 0.25, rock.y - rock.h * 0.1);
    ctx.lineTo(rock.x + rock.w * 0.35, rock.y - rock.h * 0.8);
    ctx.lineTo(rock.x + rock.w * 0.55, rock.y - rock.h * 0.1);
    ctx.closePath();
    ctx.fill();
  });
}

function drawSeabedPlants(t) {
  seabedPlants.forEach(p => {
    const sway = Math.sin(t * 0.001 + p.swayPhase) * 8;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    if (p.type === 'fern') {
      for (let s = 1; s <= 4; s++) {
        const py = p.y - (p.height / 4) * s;
        const px = p.x + sway * (s / 4);
        ctx.lineTo(px, py);
        // Fern leaves
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate((sway > 0 ? 0.6 : -0.6) + Math.sin(t*0.002+s)*0.2);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(8, 0, 10, 4, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    } else {
      ctx.quadraticCurveTo(p.x + sway, p.y - p.height * 0.6, p.x + sway * 1.5, p.y - p.height);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function drawCreepvines(t) {
  creepvines.forEach((vine, vidx) => {
    const mainSway = Math.sin(t * vine.swaySpeed + vine.swayPhase) * 50;
    const secondarySway = Math.sin(t * vine.swaySpeed * 1.5 + vine.swayPhase + 2) * 20;

    ctx.strokeStyle = vine.stalkColor;
    ctx.lineWidth = vine.stalkWidth;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(vine.x, vine.baseY);

    const points = [];
    for (let s = 1; s <= vine.segments; s++) {
      const progress = s / vine.segments;
      const px = vine.x + mainSway * progress + secondarySway * progress * progress;
      const py = vine.baseY - vine.height * progress;
      points.push({x: px, y: py, p: progress});
      ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Broad flat leaves along stalk
    if (vine.hasLeaves) {
      points.forEach((pt, pi) => {
        if (pi < 2 || pi > vine.segments - 2) return;
        if (Math.random() > vine.leafDensity) return; // Deterministic per frame... actually we should precompute. For now simple.
        // Make it deterministic-ish
        const hasLeaf = ((vidx * 7 + pi * 13) % 3 === 0);
        if (!hasLeaf) return;

        const leafSize = 18 * (1 - pt.p) + 6;
        const leafAngle = Math.sin(t * 0.001 + vidx + pi) * 0.3 + (mainSway > 0 ? 0.4 : -0.4);
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(leafAngle);
        ctx.fillStyle = hexToRgba(vine.leafColor, 0.55);
        ctx.beginPath();
        // Broad flat leaf shape
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(leafSize * 0.5, -leafSize * 0.15, leafSize, -leafSize * 0.1, leafSize * 1.2, 0);
        ctx.bezierCurveTo(leafSize, leafSize * 0.1, leafSize * 0.5, leafSize * 0.15, 0, 0);
        ctx.fill();
        ctx.restore();
      });
    }

    // Creepvine Seed Clusters (iconic orange bioluminescent pods)
    if (vine.seedCluster) {
      const seedIdx = Math.floor(vine.segments * vine.seedHeight);
      if (seedIdx < points.length) {
        const sp = points[seedIdx];
        const side = vine.seedSide;
        const pulse = 0.55 + 0.45 * Math.sin(t * 0.003 + vidx);

        // Outer glow
        const glow = ctx.createRadialGradient(sp.x + side * 14, sp.y, 0, sp.x + side * 14, sp.y, 28);
        glow.addColorStop(0, `rgba(255, 200, 60, ${pulse * 0.9})`);
        glow.addColorStop(0.3, `rgba(255, 140, 20, ${pulse * 0.5})`);
        glow.addColorStop(1, 'rgba(255, 100, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sp.x + side * 14, sp.y, 28, 0, Math.PI * 2);
        ctx.fill();

        // Cluster of pods
        ctx.fillStyle = `rgba(255, 240, 160, ${pulse * 0.95})`;
        ctx.beginPath();
        ctx.arc(sp.x + side * 10, sp.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255, 200, 50, ${pulse * 0.9})`;
        ctx.beginPath();
        ctx.arc(sp.x + side * 18, sp.y - 5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255, 160, 30, ${pulse * 0.85})`;
        ctx.beginPath();
        ctx.arc(sp.x + side * 16, sp.y + 6, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Inner bright cores
        ctx.fillStyle = `rgba(255, 255, 220, ${pulse})`;
        ctx.beginPath();
        ctx.arc(sp.x + side * 10, sp.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  });
}

function drawGlowPods(t) {
  glowPods.forEach(g => {
    const pulse = 0.4 + 0.6 * Math.sin(t * g.pulseSpeed + g.phase);
    const glow = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r * 5);
    const col = g.color === '#ffaa22' ? '255,170,34' : '136,255,204';
    glow.addColorStop(0, `rgba(${col}, ${pulse * 0.9})`);
    glow.addColorStop(0.5, `rgba(${col}, ${pulse * 0.25})`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r * 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = g.color === '#ffaa22' ? `rgba(255,220,100,${pulse})` : `rgba(180,255,230,${pulse})`;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawFish(t) {
  fishSchools.forEach(school => {
    school.x += school.vx;
    if (school.x > W + 100) school.x = -100;
    if (school.x < -100) school.x = W + 100;

    const schoolSway = Math.sin(t * 0.001 + school.y) * 20;

    school.fish.forEach(f => {
      const fx = school.x + f.ox + Math.sin(t * 0.003 + f.oy) * 10;
      const fy = school.y + f.oy + schoolSway + Math.cos(t * 0.002 + f.ox) * 5;

      // Fish body
      ctx.fillStyle = 'rgba(160, 220, 255, 0.6)';
      ctx.beginPath();
      ctx.ellipse(fx, fy, f.size * 2, f.size, 0, 0, Math.PI * 2);
      ctx.fill();
      // Tail
      ctx.fillStyle = 'rgba(140, 200, 240, 0.5)';
      ctx.beginPath();
      ctx.moveTo(fx - f.size * 1.5, fy);
      ctx.lineTo(fx - f.size * 3, fy - f.size * 0.8);
      ctx.lineTo(fx - f.size * 3, fy + f.size * 0.8);
      ctx.closePath();
      ctx.fill();
    });
  });
}

function drawBubbles(t) {
  bubbles.forEach(b => {
    b.y += b.vy;
    b.x += Math.sin(t * b.wobble + b.phase) * 0.8;
    if (b.y < -20) { b.y = H + 20; b.x = rand(0, W); }

    ctx.strokeStyle = 'rgba(200, 255, 240, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.4, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawParticles(t) {
  particles.forEach(p => {
    p.y += p.vy;
    p.x += p.vx + Math.sin(t * 0.0008 + p.phase) * 0.4;
    if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    const flicker = 0.5 + 0.5 * Math.sin(t * 0.002 + p.phase);
    ctx.fillStyle = `rgba(${p.color}, ${p.alpha * flicker})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawVolumetricFog() {
  // Depth fog: darker at bottom, subtle vignette at edges
  const vgrad = ctx.createLinearGradient(0, 0, 0, H);
  vgrad.addColorStop(0, 'rgba(2, 13, 6, 0.05)');
  vgrad.addColorStop(0.4, 'rgba(2, 13, 6, 0.15)');
  vgrad.addColorStop(0.75, 'rgba(2, 13, 6, 0.45)');
  vgrad.addColorStop(1, 'rgba(2, 13, 6, 0.75)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, W, H);

  // Side vignette
  const cgrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.95);
  cgrad.addColorStop(0, 'rgba(2, 13, 6, 0)');
  cgrad.addColorStop(1, 'rgba(2, 13, 6, 0.4)');
  ctx.fillStyle = cgrad;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- Main Loop ---------- */
function draw(t) {
  drawBackground();
  drawSurfaceLight(t);
  drawGodRays(t);
  drawSeabed(t);
  drawGlowPods(t);
  drawSeabedPlants(t);
  drawCreepvines(t);
  drawFish(t);
  drawBubbles(t);
  drawParticles(t);
  drawVolumetricFog();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
